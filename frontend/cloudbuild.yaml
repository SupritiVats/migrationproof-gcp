steps:
  - name: "docker:24.0.7"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/migrationproof-frontend"
      - "--build-arg"
      - "VITE_API_BASE_URL=${_VITE_API_BASE_URL}"
      - "."
    dir: "."
  - name: "docker:24.0.7"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/migrationproof-frontend"
images:
  - "gcr.io/$PROJECT_ID/migrationproof-frontend"
